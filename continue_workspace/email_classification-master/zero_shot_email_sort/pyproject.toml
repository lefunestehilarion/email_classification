[project]
name = "zero-shot-email-sort"
version = "0.1.0"
description = "Tri de mails par zero-shot NLI (catégories dynamiques) avec feedback et fine-tuning LoRA"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "transformers>=4.40",
    "torch>=2.2",
    "peft>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["zero_shot_email_sort"]

